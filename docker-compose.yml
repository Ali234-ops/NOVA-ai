services:
  nova-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      NOVA_HOST: 0.0.0.0
      NOVA_PORT: 8000
      NOVA_DB_PATH: /data/nova.db
      NOVA_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
    volumes:
      - nova-data:/data
    restart: unless-stopped
volumes:
  nova-data:
